<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Happy Birthday, Barbie</title>
  
  <!-- High-Fashion Luxury Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Custom Stylesheet (Cache-Busted) -->
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>

  <!-- Ambient Background Photo Slideshow (Cinematic Dual-Buffer) -->
  <div id="bg-slideshow" class="bg-slideshow" aria-hidden="true">
    <div id="bg-slide-a" class="bg-slide"></div>
    <div id="bg-slide-b" class="bg-slide"></div>
    <div class="bg-slideshow-overlay"></div>
  </div>

  <!-- ======================================================================
       STAGE 0: Minimalist Pre-Launch Countdown (Locks until Sept 20, 12 AM EST)
       ====================================================================== -->
  <div id="countdown-screen" class="countdown-screen" aria-live="polite">
    <div class="countdown-card">
      <div class="countdown-label" id="countdown-label">unlocks in</div>
      <div class="countdown-timer">
        <div class="timer-unit">
          <span id="cd-days" class="timer-num">00</span>
          <span class="timer-sub">days</span>
        </div>
        <span class="timer-sep">:</span>
        <div class="timer-unit">
          <span id="cd-hours" class="timer-num">00</span>
          <span class="timer-sub">hours</span>
        </div>
        <span class="timer-sep">:</span>
        <div class="timer-unit">
          <span id="cd-mins" class="timer-num">00</span>
          <span class="timer-sub">mins</span>
        </div>
        <span class="timer-sep">:</span>
        <div class="timer-unit">
          <span id="cd-secs" class="timer-num">00</span>
          <span class="timer-sub">secs</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ======================================================================
       STAGE 1: Minimalist Monochromatic Start Page ("enter name")
       ====================================================================== -->
  <div id="lockscreen">
    <div class="lock-card">
      <label for="name-input" class="lock-label">enter name</label>
      <form id="lock-form" class="input-container" action="javascript:void(0);" autocomplete="off">
        <input 
          type="text" 
          id="name-input" 
          class="lock-input" 
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="go"
          autofocus
        />
        <button type="submit" id="unlock-btn" class="unlock-btn" aria-label="Submit">↵</button>
      </form>
      <div id="error-msg" class="error-msg"></div>
    </div>
  </div>

  <!-- Background MP3 Audio Player -->
  <audio id="bg-audio" loop preload="auto" playsinline>
    <source src="Music/Gallan%204%20Karaoke.mp3" type="audio/mpeg">
  </audio>

  <!-- ======================================================================
       STAGE 2: Sophisticated Birthday Celebration Experience
       ====================================================================== -->
  <div id="main-stage">
    
    <!-- Floating Side Controls -->
    <div class="side-controls">
      <button id="music-toggle" class="side-btn music-toggle" aria-label="Toggle background music" title="Toggle Music">
        <span class="music-icon">🎵</span> <span id="music-status-text">Music</span>
      </button>
      <button id="confetti-blast-btn" class="side-btn confetti-btn" aria-label="Celebrate with confetti" title="Celebrate">
        🎉
      </button>
    </div>

    <!-- Hero Section -->
    <header class="hero-section">
      <div class="hero-eyebrow">A Celebration of You</div>
      <h1 id="bday-title" class="bday-title">Happy Birthday, <em>Barbie</em></h1>
      <p id="bday-subtitle" class="bday-subtitle">Celebrating you and every cherished memory we share.</p>
    </header>

    <!-- Letter Section -->
    <section class="letter-section">
      <div class="letter-envelope">
        <div class="letter-content">
          <p id="letter-salutation" class="letter-salutation"></p>
          <div id="letter-body"></div>
          <div id="letter-signoff" class="letter-signoff"></div>
        </div>
      </div>
    </section>

    <!-- Single Window Photo Viewer (Looping with Mobile Swipe) -->
    <section class="photo-viewer-section">
      <div class="viewer-card">
        <div class="viewer-header">
          <span class="section-eyebrow">Memories</span>
        </div>

        <div class="viewer-frame" id="viewer-frame">
          <div class="viewer-img-container">
            <img id="viewer-img" src="" alt="Barbie's Memory" />
          </div>

          <!-- Overlay Navigation Arrows -->
          <button id="viewer-prev-arrow" class="viewer-nav-btn prev-arrow" aria-label="Previous photo">‹</button>
          <button id="viewer-next-arrow" class="viewer-nav-btn next-arrow" aria-label="Next photo">›</button>
        </div>

        <!-- Bottom Controls & Counter -->
        <div class="viewer-footer">
          <button id="viewer-prev-btn" class="viewer-btn">‹ Previous</button>
          <span class="viewer-counter" id="viewer-counter">1 / 14</span>
          <button id="viewer-next-btn" class="viewer-btn">Next ›</button>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <p>Crafted with warmth for Barbie's Birthday Celebration</p>
    </footer>

  </div>

  <!-- Scripts (Cache-Busted) -->
  <script src="config.js?v=15"></script>
  <script src="script.js?v=15"></script>
</body>
</html>
